name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "screenshots/**"
      - "public/favicon.svg"
      - "public/favicon.ico"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-flight run finish rather
# than cancelling it, since it may already be live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the static site
        # The docs page is plain HTML with no build step. Screenshots and the
        # favicon live at the repo root so the running app and the docs page
        # share one copy instead of a duplicated, driftable one.
        run: |
          cp -r screenshots site/screenshots
          cp public/favicon.svg site/favicon.svg
          cp public/favicon.ico site/favicon.ico

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
