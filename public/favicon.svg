<!--
  A dotted trail arriving at a destination — the journey line the deck draws on
  the map, reduced to what survives a 16px browser tab. Repeating one shape at
  three sizes keeps it legible there, where two different shapes would merge.
  Colours are --ui-primary and the light/dark stops map-pin and map-circle
  derive from it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="g" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#847eed" />
      <stop offset="100%" stop-color="#3731a0" />
    </radialGradient>
  </defs>
  <circle cx="3" cy="16" r="2.1" fill="#4f46e5" opacity="0.5" />
  <circle cx="10" cy="16" r="2.6" fill="#4f46e5" opacity="0.8" />
  <circle cx="23.5" cy="16" r="7.2" fill="url(#g)" />
</svg>
